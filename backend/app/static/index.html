<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRADEIQ v2.0 — 3-Engine Live Auto Paper-Trading Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [hidden]{display:none !important}
    body { background: #020617; color: #f1f5f9; font-family: Inter, system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="login-view" class="fixed inset-0 z-50 bg-slate-950/95 flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-3xl border border-slate-800 bg-slate-900 p-7 shadow-2xl">
      <div class="flex items-center justify-between mb-5">
        <div>
          <div class="text-xl font-bold text-white">TRADEIQ <span class="text-sky-400">v2.0</span></div>
          <div class="text-xs text-slate-400">3-Engine Live Auto Paper-Trading Terminal</div>
        </div>
        <span class="px-2.5 py-0.5 rounded-full text-[11px] bg-sky-500/15 text-sky-300 border border-sky-500/30">OWNER ONLY</span>
      </div>
      <div id="login-error" hidden class="mb-3 rounded-xl bg-rose-500/15 border border-rose-500/30 p-2.5 text-xs text-rose-200"></div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <input id="owner-password" type="password" placeholder="Enter owner password" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3.5 py-2.5 text-sm text-white mb-3 focus:border-sky-500 focus:outline-none" />
        <button type="submit" class="w-full rounded-xl bg-sky-500 hover:bg-sky-400 py-2.5 text-sm font-semibold text-slate-950">Unlock Live Terminal</button>
      </form>
      <p class="mt-4 text-[11px] text-slate-500 text-center">Paper Trading Only — Zero real-money broker orders.</p>
    </div>
  </div>

  <div id="app-view" hidden class="min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/90 backdrop-blur-xl">
      <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="h-8 w-8 rounded-xl bg-gradient-to-br from-sky-400 to-emerald-400 flex items-center justify-center text-slate-950 font-black text-sm">TQ</div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-white">TRADEIQ v2.0</span>
              <span id="liveBadge" class="px-2 py-0.5 rounded-full text-[11px] bg-amber-500/15 text-amber-300 border border-amber-500/30">CONNECTING</span>
            </div>
            <div class="text-[11px] text-slate-400">Live NSE + Nifty/BankNifty/Sensex • Penny-Accurate P&amp;L</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div id="indicesStrip" class="flex flex-wrap items-center gap-2 text-xs"></div>
          <button onclick="signOut()" class="rounded-xl border border-rose-500/30 bg-rose-500/15 px-3 py-1.5 text-xs text-rose-200">Sign Out</button>
        </div>
      </div>
      <nav class="border-t border-slate-800 bg-slate-900/70">
        <div id="menuBar" class="max-w-7xl mx-auto px-3 py-1.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
      </nav>
    </header>
    <main id="content" class="max-w-7xl w-full mx-auto px-4 py-5 flex-1"></main>
  </div>

  <script>
    const SESSION_KEY = 'tradeiq.owner.session';
    const TABS = [
      ['dashboard','Dashboard'],['autotrader','Auto-Trader'],['engines','3-Engine Scanner'],
      ['positions','Paper Positions'],['accuracy','Accuracy & P&L'],['news','Market News'],
      ['assistant','AI Assistant'],['system','System & Settings']
    ];
    let authToken = sessionStorage.getItem(SESSION_KEY) || null;
    let activeTab = 'dashboard';
    let state = { indices: [], overview: null, ledger: null, auto: null, scan: null, news: null, integrations: null };

    const fmtInr = (v, signed=false) => {
      const n = Number(v || 0);
      const s = Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (n < 0) return `-₹${s}`;
      return signed && n > 0 ? `+₹${s}` : `₹${s}`;
    };
    const pCol = (v) => Number(v||0) > 0 ? 'text-emerald-400' : (Number(v||0) < 0 ? 'text-rose-400' : 'text-slate-300');

    function showLogin(msg) {
      authToken = null;
      try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
      document.getElementById('app-view').hidden = true;
      document.getElementById('login-view').hidden = false;
      const err = document.getElementById('login-error');
      if (msg) { err.textContent = msg; err.hidden = false; } else { err.hidden = true; }
    }

    function showApp() {
      document.getElementById('login-view').hidden = true;
      document.getElementById('app-view').hidden = false;
    }

    function signOut() { showLogin('Signed out.'); }

    async function apiFetch(path, opts={}) {
      if (!authToken) { showLogin('Please sign in.'); throw new Error('Not signed in'); }
      const res = await fetch(path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken,
        }
      });
      if (res.status === 401) {
        showLogin('Session expired. Please sign in again.');
        throw new Error('Unauthorized');
      }
      return res.json();
    }

    async function handleLogin(ev) {
      ev.preventDefault();
      const pwd = document.getElementById('owner-password');
      const err = document.getElementById('login-error');
      err.hidden = true;
      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd.value })
        });
        const body = await res.json();
        if (!res.ok || !body.access_token) throw new Error(body?.error?.message || 'Invalid password');
        authToken = body.access_token;
        pwd.value = '';
        try { sessionStorage.setItem(SESSION_KEY, authToken); } catch (_) {}
        showApp();
        await refreshAll();
      } catch (e) {
        err.textContent = e.message;
        err.hidden = false;
      }
    }

    function renderMenu() {
      document.getElementById('menuBar').innerHTML = TABS.map(([k, lbl]) => `
        <button onclick="switchTab('${k}')" class="shrink-0 rounded-xl px-3.5 py-2 text-xs font-medium ${activeTab===k ? 'bg-sky-500 text-slate-950 font-semibold' : 'text-slate-300 hover:bg-slate-800'}">${lbl}</button>
      `).join('');
    }

    function renderIndices() {
      document.getElementById('indicesStrip').innerHTML = (state.indices || []).map(i => `
        <div class="rounded-xl border border-slate-800 bg-slate-900 px-3 py-1.5 flex items-center gap-2">
          <span class="font-semibold text-slate-300">${i.symbol}</span>
          <span class="mono font-semibold text-white">${i.ltp ? '₹'+Number(i.ltp).toLocaleString('en-IN') : 'OFFLINE'}</span>
          ${i.change_pct != null ? `<span class="mono ${pCol(i.change_pct)}">${Number(i.change_pct)>0?'+':''}${i.change_pct}%</span>` : ''}
        </div>
      `).join('');
      const b = document.getElementById('liveBadge');
      const live = state.overview?.freshness === 'LIVE';
      b.textContent = live ? 'LIVE FEED' : (state.overview?.freshness || 'OFFLINE');
      b.className = `px-2 py-0.5 rounded-full text-[11px] border ${live ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' : 'bg-amber-500/15 text-amber-300 border-amber-500/30'}`;
    }

    async function switchTab(k) {
      activeTab = k;
      renderMenu();
      if (k === 'engines' && !state.scan) state.scan = await apiFetch('/api/v1/engines/scan?limit=12');
      if (k === 'news' && !state.news) state.news = await apiFetch('/api/v1/news');
      if (k === 'system') state.integrations = await apiFetch('/api/v1/integrations/status');
      renderBody();
    }

    async function refreshAll() {
      const [idx, ov, led, at] = await Promise.all([
        apiFetch('/api/v1/market/indices'), apiFetch('/api/v1/market/overview?limit=12'),
        apiFetch('/api/v1/paper/ledger'), apiFetch('/api/v1/auto-trader/status')
      ]);
      state.indices = idx.indices || []; state.overview = ov; state.ledger = led; state.auto = at;
      renderIndices(); renderMenu(); renderBody();
    }

    async function runAutoNow() {
      state.scan = await apiFetch('/api/v1/auto-trader/run', { method:'POST', body: JSON.stringify({ execute_entries: true, limit: 12 }) });
      await refreshAll();
    }

    async function saveCfg() {
      await apiFetch('/api/v1/auto-trader/config', {
        method:'PUT',
        body: JSON.stringify({
          starting_balance_inr: Number(document.getElementById('cBal').value),
          per_trade_amount_inr: Number(document.getElementById('cPer').value),
          max_open_positions: Number(document.getElementById('cMax').value),
        })
      });
      await refreshAll();
    }

    function renderBody() {
      const led = state.ledger?.ledger || {};
      const el = document.getElementById('content');
      if (activeTab === 'dashboard') {
        el.innerHTML = `
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-4"><div class="text-xs text-slate-400">Live Equity</div><div class="text-xl mono font-bold mt-1">${fmtInr(led.total_equity_inr)}</div></div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-4"><div class="text-xs text-slate-400">Live Net P&amp;L</div><div class="text-xl mono font-bold mt-1 ${pCol(led.total_net_pnl_inr)}">${fmtInr(led.total_net_pnl_inr, true)}</div></div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-4"><div class="text-xs text-slate-400">Available Cash</div><div class="text-xl mono font-bold text-sky-300 mt-1">${fmtInr(led.available_cash_inr)}</div></div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-4"><div class="text-xs text-slate-400">Accuracy</div><div class="text-xl mono font-bold text-emerald-400 mt-1">${led.accuracy_pct||'0.0'}% (${led.wins||0}W/${led.losses||0}L)</div></div>
          </div>
          <div class="rounded-2xl border border-slate-800 bg-slate-900 p-4">
            <div class="flex justify-between items-center mb-3"><h3 class="text-sm font-semibold">Live Market Pulse</h3><button onclick="runAutoNow()" class="rounded-xl bg-emerald-500 px-3 py-1.5 text-xs font-semibold text-slate-950">Run 3-Engine Auto Cycle</button></div>
            <div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead class="text-slate-400 border-b border-slate-800"><tr><th class="py-2">Symbol</th><th>LTP</th><th>Change</th></tr></thead><tbody>
              ${(state.overview?.quotes||[]).map(q => `<tr class="border-b border-slate-800/50"><td class="py-2 font-semibold">${q.symbol}</td><td class="mono">${fmtInr(q.ltp)}</td><td class="mono ${pCol(q.change_pct)}">${q.change_pct}%</td></tr>`).join('')}
            </tbody></table></div>
          </div>`;
      } else if (activeTab === 'autotrader') {
        const c = state.auto?.config || {};
        el.innerHTML = `<div class="rounded-2xl border border-slate-800 bg-slate-900 p-5 max-w-xl space-y-3">
          <h3 class="text-sm font-semibold">Auto-Trader Balance &amp; Allocation</h3>
          <div class="grid grid-cols-3 gap-3 text-xs">
            <div><label class="text-slate-400">Balance (₹)</label><input id="cBal" value="${c.starting_balance_inr||100000}" class="w-full mt-1 rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 mono"/></div>
            <div><label class="text-slate-400">Per-Trade (₹)</label><input id="cPer" value="${c.per_trade_amount_inr||20000}" class="w-full mt-1 rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 mono"/></div>
            <div><label class="text-slate-400">Max Open</label><input id="cMax" value="${c.max_open_positions||4}" class="w-full mt-1 rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 mono"/></div>
          </div>
          <div class="flex gap-2"><button onclick="saveCfg()" class="rounded-xl bg-sky-500 px-4 py-2 text-xs font-semibold text-slate-950">Save</button><button onclick="runAutoNow()" class="rounded-xl bg-emerald-500 px-4 py-2 text-xs font-semibold text-slate-950">Run Auto-Trade Now</button></div>
        </div>`;
      } else if (activeTab === 'news') {
        el.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${(state.news?.items||[]).map(n => `
          <div class="rounded-2xl border border-slate-800 bg-slate-900 p-4">
            <div class="flex justify-between text-[11px] mb-1"><span class="text-sky-300">${n.source_name}</span><span class="text-slate-300">${n.sentiment}</span></div>
            <div class="text-sm font-semibold">${n.headline}</div>
            <p class="text-xs text-slate-400 mt-1.5">${n.ai_summary||''}</p>
            <a href="${n.source_url}" target="_blank" class="inline-block mt-2 text-xs text-sky-400">Read Full Article →</a>
          </div>`).join('') || '<div class="text-xs text-slate-400">No news loaded yet.</div>'}</div>`;
      } else {
        el.innerHTML = `<div class="rounded-2xl border border-slate-800 bg-slate-900 p-5 text-xs text-slate-300">Open Positions: ${led.open_count||0} | Closed: ${led.closed_count||0} | Accuracy: ${led.accuracy_pct||'0.0'}% | Net P&amp;L: <span class="mono ${pCol(led.total_net_pnl_inr)}">${fmtInr(led.total_net_pnl_inr, true)}</span></div>`;
      }
    }

    if (authToken) { showApp(); refreshAll(); } else { showLogin(''); }
    renderMenu();
  </script>
</body>
</html>
